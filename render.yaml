services:
  - type: web
    name: brainup-backend
    runtime: python
    repo: https://github.com/karanak1513-debug/brainup
    branch: main
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install --prefer-offline --no-audit && npm run build
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
